databases:
  - name: whatsapp-agent-db
    databaseName: whatsapp_agent
    user: postgres
    plan: free
    region: oregon

services:
  - type: web
    name: whatsapp-ai-agent
    runtime: docker
    dockerfilePath: ./whatsapp-agent/Dockerfile
    dockerContext: ./whatsapp-agent
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: BUSINESS_NAME
        value: Al-Madina Mobile Store
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-agent-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_NUMBER_ID
        sync: false
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: STAFF_ALERT_PHONE
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ODOO_URL
        value: http://localhost:8069
      - key: ODOO_DB
        value: odoo
      - key: ODOO_USER
        value: admin
      - key: ODOO_API_KEY
        sync: false
