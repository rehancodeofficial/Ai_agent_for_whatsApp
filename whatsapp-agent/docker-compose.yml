services:
  web:
    build: .
    container_name: whatsapp_agent_app
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside a container "localhost" is the container itself, so the host's
      # Postgres is reached through host.docker.internal. Keep the credentials
      # in .env (this file is tracked by git), as DOCKER_DATABASE_URL.
      - DATABASE_URL=${DOCKER_DATABASE_URL:?set DOCKER_DATABASE_URL in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
